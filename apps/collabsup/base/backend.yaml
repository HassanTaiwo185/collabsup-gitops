apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  DEBUG: "False"
  DB_HOST: "collabsup-db.cyv8auwy0hqf.us-east-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "collaboration_db"
  DB_USER: "postgres"
  FRONTEND_URL: "http://localhost:8080"
  ALLOWED_HOSTS: "localhost,127.0.0.1"
  REDIS_URL: "rediss://master.collabsup-cache.cwchy1.use1.cache.amazonaws.com:6379/0"
  CELERY_BROKER_URL: "rediss://master.collabsup-cache.cwchy1.use1.cache.amazonaws.com:6379/0?ssl_cert_reqs=required"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backend
      containers:
        - name: backend
          image: 897154406243.dkr.ecr.us-east-1.amazonaws.com/collabsup-backend
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000